---
name: tool-cache-proof

on:
  push:
    branches:
      - proof-tool-cache

jobs:
  before:
    name: Before (erlef/setup-beam v1.24.1)
    runs-on: ubuntu-24.04
    steps:
      - name: First setup-beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29'
      - name: Second setup-beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29'
      - name: Tool cache content
        run: find "$RUNNER_TOOL_CACHE/otp" -maxdepth 3

  after:
    name: After (fix a4d75d6)
    runs-on: ubuntu-24.04
    steps:
      - name: First setup-beam
        uses: rubas/setup-beam@a4d75d68f708c8215e8f8d972d6fcc7b9e8c2efc
        with:
          otp-version: '29'
      - name: Second setup-beam
        uses: rubas/setup-beam@a4d75d68f708c8215e8f8d972d6fcc7b9e8c2efc
        with:
          otp-version: '29'
      - name: Tool cache content
        run: find "$RUNNER_TOOL_CACHE/otp" -maxdepth 3
